name: CLMix
options:
  bundleIdPrefix: com.clmix
  deploymentTarget:
    iOS: "17.0"
settings:
  # Automatic signing, no team baked in - Simulator builds need no signing
  # at all, so this still builds clean out of the box. Device/archive
  # builds (TestFlight, ad-hoc, App Store) need a real Apple Developer
  # team: pick one under the CLMix target's Signing & Capabilities tab in
  # Xcode, or set DEVELOPMENT_TEAM here to your team ID so `xcodegen
  # generate` bakes it in for everyone building this checkout.
  CODE_SIGN_STYLE: Automatic
  DEVELOPMENT_TEAM: ""
targets:
  CLMix:
    type: application
    platform: iOS
    sources:
      - path: CLMix
    info:
      path: CLMix/Info.plist
      properties:
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: "CLMix finds and connects to the desktop mixer app on your local network."
        NSBonjourServices:
          - _clmix._tcp.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.clmix.CLMix
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: "AppIcon"
