name: CLMix
options:
  bundleIdPrefix: com.clmix
  deploymentTarget:
    iOS: "17.0"
settings:
  # Automatic signing against the team below, so `xcodegen generate` wires
  # up a buildable project with no Signing & Capabilities fiddling in
  # Xcode. Simulator builds need no signing at all and work regardless;
  # device builds and archives (TestFlight, ad-hoc, App Store) resolve a
  # profile from this team, so a machine whose Xcode is not signed in to
  # an account with access to it can still run the Simulator but cannot
  # archive. The team ID is not a secret - it ships inside every signed
  # app, in the application-identifier entitlement - so it lives here
  # rather than in a gitignored file.
  CODE_SIGN_STYLE: Automatic
  DEVELOPMENT_TEAM: "5A5LF52KKC"
targets:
  CLMix:
    type: application
    platform: iOS
    sources:
      - path: CLMix
    info:
      path: CLMix/Info.plist
      properties:
        # Without these two, XcodeGen's own plist generator defaults them to
        # literal "1.0"/"1" on every `xcodegen generate` - silently
        # overwriting CLMix/Info.plist and discarding whatever
        # CFBundleShortVersionString/CFBundleVersion this file previously
        # had, regardless of the MARKETING_VERSION/CURRENT_PROJECT_VERSION
        # build settings below (which then go completely unused, since nothing
        # in the plist ever references them). Pointing these at the build
        # settings via $() is what makes the two actually take effect, and
        # keeps a plain `xcodegen generate` from quietly reverting a version
        # bump the next time anything else about the project changes.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: "CLMix finds and connects to the desktop mixer app on your local network."
        NSBonjourServices:
          - _clmix._tcp.
        # Answers App Store Connect's export-compliance question up front,
        # rather than being asked it on every upload. True of this app: the
        # only cryptography is the system Keychain and the platform's own
        # TLS, neither of which counts, and the mixer socket is plain ws://.
        ITSAppUsesNonExemptEncryption: false
        # Portrait and both landscapes, matching the other mobile
        # platform - every screen there handles a rotation in place rather
        # than being locked to one orientation, and a phone laid flat on a
        # desk next to the console is held whichever way the operator
        # happens to be standing.
        #
        # Landscape trades fader travel for strips on screen: the grid
        # fits roughly twice as many channels at once, while the faders
        # themselves lose most of their height to the chrome above and
        # below them. That is the same trade the other platform already
        # makes, so it is deliberately not corrected for here.
        #
        # Upside-down is deliberately absent: the phone reports it on
        # tablets only, and a mixing surface that can arrive rotated 180
        # degrees while being operated is not worth the one case where
        # somebody wanted it.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Stays true for two separate reasons. It opts out of iPad
        # multitasking (Split View/Slide Over), which can hand the app an
        # arbitrary fraction of the screen in any orientation - untested
        # layout territory that rotation itself does not cover. It also
        # keeps Xcode's "All interface orientations must be supported
        # unless the app requires full screen" validation satisfied
        # (ITMS-90474 at App Store Connect upload), which
        # TARGETED_DEVICE_FAMILY "1,2" triggers by including the iPad
        # idiom and which upside-down's absence above would otherwise
        # fail.
        UIRequiresFullScreen: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.clmix.CLMix
        # 1.0.0 is on the App Store. This release adds Personalization -
        # letting an account relabel channels on its own aux screens,
        # without touching the console - so it is a minor bump rather
        # than a patch one, following the same rule version.py states
        # for the desktop app: a new feature moves MINOR and resets
        # PATCH. (1.2.0 before it added Full Mixer Control.)
        #
        # Deliberately not tied to the phone app on the other platform,
        # which ships on its own schedule and carries its own numbering;
        # neither is it tied to version.py, which is the desktop app and
        # the server this talks to.
        MARKETING_VERSION: "1.4.0"
        # Every new upload needs a build number App Store Connect hasn't
        # seen before for this bundle ID, even for a new marketing version
        # - so this moves on every upload, including a resubmission of the
        # same version. 7 went up as "TestFlight Internal Only", which can
        # never be attached to an App Store version, hence 8.
        CURRENT_PROJECT_VERSION: "8"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: "AppIcon"
      # Debug signs automatically, as "Apple Development" - the identity a
      # new Xcode project gets. The Simulator needs no signing at all; a
      # build to a physical device uses this.
      #
      # Release signs manually, straight for the App Store: the "Apple
      # Distribution" certificate and the "CLMix App Store" profile (App
      # Store Connect type, for com.clmix.CLMix, made by hand in
      # Certificates, Identifiers & Profiles). Automatic signing archives
      # with a development profile first, and Apple only issues one to a
      # team with a device registered to it - this team has none, so an
      # automatic archive fails with "Your team has no devices from which
      # to generate a provisioning profile". A distribution profile needs
      # no devices. When the certificate is renewed, regenerate the
      # profile against the new one under the same name.
      #
      # Neither identity may be blank: an empty CODE_SIGN_IDENTITY switches
      # signing off altogether, which archives "successfully" but unsigned
      # - and Organizer then refuses it with "No Team Found in Archive".
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "Apple Development"
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "CLMix App Store"
