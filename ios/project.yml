name: CLMix
options:
  bundleIdPrefix: com.clmix
  deploymentTarget:
    iOS: "17.0"
settings:
  DEVELOPMENT_TEAM: ""
  CODE_SIGN_IDENTITY: ""
  CODE_SIGNING_REQUIRED: "NO"
  CODE_SIGNING_ALLOWED: "NO"
targets:
  CLMix:
    type: application
    platform: iOS
    sources:
      - path: CLMix
    info:
      path: CLMix/Info.plist
      properties:
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: "CLMix finds and connects to the desktop mixer app on your local network."
        NSBonjourServices:
          - _clmix._tcp.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.clmix.CLMix
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
