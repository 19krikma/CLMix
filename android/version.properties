# App version - bump this on every release that ships a fix or feature.
#
#   VERSION_PATCH += 1   -> bug fix
#   VERSION_MINOR += 1, VERSION_PATCH = 0   -> new feature
#   VERSION_MAJOR += 1, VERSION_MINOR = 0, VERSION_PATCH = 0   -> breaking change
#
# versionCode (the integer the Play Store uses to tell releases apart,
# must strictly increase) and versionName ("MAJOR.MINOR.PATCH", the
# human-readable one) are both derived from this file in build.gradle.kts.
VERSION_MAJOR=1
VERSION_MINOR=0
VERSION_PATCH=0
