org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official

# Hands resource shrinking to R8 instead of the standalone shrinker, so it
# runs against the same whole-program view R8 already has of the code. Cut
# ~600KB off the 2.4.0 bundle. Play Console flags its absence under "Improve
# your app's memory and performance with R8 optimization".
#
# It becomes the default in AGP 9, at which point this line is redundant and
# can go. It shrinks harder than the old one, so anything reached only
# reflectively needs checking in a release build - not a debug one, which
# doesn't shrink at all.
android.r8.optimizedShrinking=true
